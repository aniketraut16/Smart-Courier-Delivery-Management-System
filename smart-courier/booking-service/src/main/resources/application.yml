spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/booking_service_db
    username: dummy_user
    password: dummy_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    openai:
      api-key: dummy_openai_api_key_replace_me
      chat:
        options:
          model: dummy_model_gpt_4o_replace_me
          temperature: 0.7
server:
  port: 8082
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
jwt:
  secret: dummy_jwt_secret_placeholder_replace_me_in_production
  expiration: 86400000
  refresh-expiration: 604800000
feign:
  client:
    config:
      default:
        loggerLevel: FULL
logging:
  level:
    root: INFO
    com.smartcourier.bookingservice: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info
