spring:
  application:
    name: discovery-server
server:
  port: 8761
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
logging:
  level:
    root: INFO
    com.smartcourier.discovery: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info
